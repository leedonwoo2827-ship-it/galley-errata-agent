<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS 정오표 에이전트</title>
<style>
:root{
  --rail:#201e1b;--rail-fg:#efece5;--rail-mute:#b3aca1;--rail-dim:#8a8378;--rail-brand:#7fb3d5;--rail-hover:#302e2b;--rail-active:#26303a;--rail-line:rgb(255 255 255/.09);
  --paper:#f7f5f1;--card:#fffdfa;--fg:#24211d;--mute:#6b645a;--line:#e4ded4;--brand:#2f5f86;--wash:#e6eef5;
  --ok:#2f6b3a;--okbg:#e5f1e3;--bad:#b42318;--badbg:#fbe9e6;--warn:#8a5a00;--warnbg:#fbf0d9;--log:#1b1916;--logfg:#e6e0d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#8bbbe0;--wash:#1f2a33;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--warn:#f1cf9c;--warnbg:#3a3020;--log:#0f0e0c}}
:root[data-theme="dark"]{--paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#8bbbe0;--wash:#1f2a33;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--warn:#f1cf9c;--warnbg:#3a3020;--log:#0f0e0c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--fg);font:13.5px/1.6 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;display:flex}
.rail{width:262px;flex:none;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand b{font-size:16px;letter-spacing:-.2px}
.pill{background:#2f5f86;color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:5px 10px}
.brand small{display:block;color:var(--rail-dim);font-size:11.5px;margin-top:6px}
.newbook{display:block;width:100%;margin-top:12px;background:var(--rail-brand);border:0;color:#10202c;font-weight:800;font-size:15px;border-radius:22px;padding:10px 0}
.newbook:hover{background:#97c4e2}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav a{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;margin:1px 0}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--rail-active);box-shadow:inset 3px 0 0 var(--rail-brand)}
.nav-no{font-weight:800;color:var(--rail-brand);min-width:34px;font-variant-numeric:tabular-nums;font-size:12.5px}
.nav-t{flex:1;min-width:0;overflow-wrap:anywhere}
.nav-t em{display:block;font-style:normal;font-size:11.5px;color:var(--rail-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sec{color:var(--rail-dim);font-size:11px;letter-spacing:.5px;padding:12px 10px 4px}
.chip{font-size:10.5px;border-radius:9px;padding:0 6px;background:rgb(255 255 255/.08);color:var(--rail-mute);white-space:nowrap}
.chip.ok{background:#2f4a33;color:#bfe3c3}.chip.warn{background:#4a3a26;color:#f1cf9c}.chip.who{background:#26384a;color:#bcd7ee}
.rail-foot{border-top:1px solid var(--rail-line);padding:10px 14px;font-size:11.5px;color:var(--rail-dim)}
.rail-foot .bar{background:rgb(255 255 255/.1)}
.cxbtn{cursor:pointer;color:var(--rail-fg);padding:6px 8px;margin:0 -8px 6px;border-radius:8px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cxbtn:hover{background:var(--rail-hover)}
.cxmail{color:var(--rail-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cxmenu{background:var(--rail-hover);border-radius:8px;padding:8px 10px;margin:-2px -8px 8px;color:var(--rail-mute);overflow-wrap:anywhere}
.cxmenu button{background:transparent;color:var(--rail-fg);border-color:var(--rail-line);padding:3px 9px;font-size:12px}
.cxmenu button:hover{background:var(--rail-active)}
main{flex:1;min-width:0;height:100vh;overflow:auto;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);margin:2px 0 14px;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:0 4px}
.mute{color:var(--mute)}
button,select,input{font:inherit;color:var(--fg)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--wash)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin:6px 0}
.drop.drag{border-color:var(--brand);background:var(--wash)}
.drop .name{font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
pre.log{background:var(--log);color:var(--logfg);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font:12px/1.5 Consolas,"D2Coding",monospace;white-space:pre-wrap;margin:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle;font-size:13px}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td input[type=text]{width:100%}
td input[type=number]{width:62px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-width:100px;background:var(--paper)}
.kpi b{display:block;font-size:19px}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stage{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);cursor:pointer}
.stage:hover{border-color:var(--brand)}
.stage b{display:block;font-size:12.5px}
.stage span{font-size:11.5px;color:var(--mute)}
iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.tag{font-size:11px;border-radius:9px;padding:1px 7px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.plain{background:var(--paper);color:var(--mute);border:1px solid var(--line)}
#toast{position:fixed;right:18px;top:16px;background:var(--fg);color:var(--paper);padding:9px 34px 9px 16px;border-radius:10px;display:none;max-width:min(460px,90vw);z-index:9;cursor:pointer;box-shadow:0 6px 24px rgb(0 0 0/.18)}
#toast::after{content:"✕";position:absolute;right:12px;top:9px;opacity:.6}
.alert{border:1px solid var(--bad);background:var(--badbg);color:var(--fg);border-radius:10px;padding:10px 14px;margin:8px 0;position:relative}
.alert b{color:var(--bad)}
.alert .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:15px;padding:2px 6px}
.alert code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:12.5px Consolas,"D2Coding",monospace}
.alert details{margin-top:6px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.iconbtn{padding:2px 7px;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.notes{margin:4px 0 0;padding-left:18px}
.notes li{margin:2px 0}
.late{color:var(--bad);font-weight:700}
@media (max-width:820px){body{display:block}.rail{width:auto;height:auto;position:static}.nav{max-height:240px}main{height:auto}.stages{grid-template-columns:repeat(3,1fr)}.wrap{padding:16px}}
</style></head>
<body>
<nav class="rail">
  <div class="brand"><div class="row" style="gap:8px"><span class="pill">TS 정오표</span><b>에이전트</b></div>
    <small>가제본 속독 → 소절별 정오표 · Judge · Evidence · Verdict</small>
    <button class="newbook" onclick="newBook()">＋ 새 책 넣기</button></div>
  <div class="nav" id="nav"></div>
  <div class="rail-foot" id="foot"></div>
</nav>
<main><div class="wrap" id="view"></div></main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+"MB" : Math.max(1, Math.round(n/1024))+"KB";
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(()=>({error:"응답 오류"})); if(!r.ok || j.ok===false) throw new Error(j.error||r.status); return j };
function toast(t, ms=3500){ const e=$("toast"); e.textContent=t; e.style.display="block"; e.onclick=()=>e.style.display="none"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",ms) }
const pp = p => p && p[0]===0 ? "표지–"+p[1] : p ? p[0]+"–"+p[1] : "";
const today = () => new Date().toISOString().slice(0,10);

let APP = null, US = null, DRAFT = null, timer = null, wasRunning = false;
const route = () => { const m = location.hash.match(/^#\/u\/(.+)$/); if(m) return {view:"unit", id:decodeURIComponent(m[1])};
  return {view: location.hash==="#/all" ? "all" : "book"} };
const ulink = id => "#/u/"+encodeURIComponent(id);

async function refresh(){
  try{
    APP = await api("/api/state");
    const r = route();
    if(r.view === "unit") US = await api("/api/unit?id="+encodeURIComponent(r.id)).catch(e=>{toast(e.message); location.hash="#/book"; return null});
    renderNav(); renderView(false);
  }catch(e){ $("view").innerHTML = `<div class="empty">서버에 연결할 수 없습니다. run.bat 창이 열려 있는지 확인하세요.</div>` }
  clearTimeout(timer); timer = setTimeout(refresh, APP && (APP.job.running || (APP.codex && (APP.codex.checking || APP.codex.login_open))) ? 1200 : 6000);
}

const ST = {"미판정":"", "판정완료":"warn", "검토완료":"ok"};
function renderNav(){
  const r = route();
  let h = `<a href="#/book" class="${r.view==="book"?"on":""}"><span class="nav-no">0</span><span class="nav-t">책 넣기 · 단위<em>${APP.book ? esc(APP.book.file) : "교재 PDF 전체를 올리세요"}</em></span></a>`;
  const done = APP.units.filter(u=>u.status==="검토완료").length;
  h += `<a href="#/all" class="${r.view==="all"?"on":""}"><span class="nav-no">Σ</span><span class="nav-t">전체 속독 · 정오표<em>검토 ${done}/${APP.units.length} · ${APP.merged ? "합본 "+esc(APP.merged.time) : "합본 없음"}</em></span></a>`;
  h += `<div class="nav-sec">소절별 정오표</div>`;
  if(!APP.units.length) h += `<div class="nav-sec" style="letter-spacing:0">단위 목록을 확정하면 소절이 나타납니다.</div>`;
  for(const u of APP.units){
    const st = u.status!=="미판정" ? `<span class="chip ${ST[u.status]}">${u.status==="검토완료" ? "정오표 "+u.errata : "후보 "+u.candidates}</span>` : "";
    const who = u.assignee ? `<span class="chip who">${esc(u.assignee)}${u.due?" · "+esc(u.due.slice(5)):""}</span>` : "";
    h += `<a href="${ulink(u.id)}" class="${r.view==="unit"&&r.id===u.id?"on":""}"><span class="nav-no">${esc(u.id)}</span>
      <span class="nav-t">${esc(u.title.replace(/^\d+\.\d+\s*/,""))}<em>p.${pp(u.printed)} · ${u.n_pages}쪽</em>
      <span class="row" style="gap:4px;margin-top:3px">${st}${who}</span></span></a>`;
  }
  $("nav").innerHTML = h;
  const j = APP.job;
  $("foot").innerHTML = codexFoot() + (j.name ? `<div>${j.running ? "⏳" : (j.error ? "⚠" : "✓")} ${esc(j.name)}${j.uid ? " · "+esc(j.uid) : ""}</div><div class="bar"><i style="width:${progress(j)}%"></i></div>` : "")
    + `<div title="${esc(APP.workspace)}">워크스페이스: ${esc(APP.workspace.split(/[\\/]/).slice(-2).join("/"))}</div>`;
  if(wasRunning && !j.running) toast(j.error ? (j.error_kind==="auth" ? "⚠ Codex 로그인 만료 — 화면의 안내를 확인하세요" : "⚠ "+j.name+" 중단 — 화면의 안내를 확인하세요") : j.name+" 완료", 6000);
  wasRunning = j.running;
}

function progress(j){
  if(!j.name) return 0;
  if(!j.running) return 100;
  const tot = j.log.map(l=>l.match(/4쪽 구간 (\d+)건을 Codex/)).filter(Boolean).pop();
  const since = j.log.length - [...j.log].reverse().findIndex(l=>/4쪽 구간 \d+건을 Codex/.test(l));
  const done = tot ? j.log.slice(since).filter(l=>/^\s*\[(판정|cache|오류)\]/.test(l)).length : 0;
  const inner = tot ? done/(+tot[1]||1) : 0;
  if(j.name === "전체 판정"){
    const m = j.log.map(l=>l.match(/^\[전체\] (\d+)\/(\d+)/)).filter(Boolean).pop();
    return m ? Math.min(99, 4 + 95*((+m[1]-1+inner)/+m[2])) : 3;
  }
  if(j.name === "교정 판정") return tot ? Math.min(97, 12 + 85*inner) : 6;
  return 45;
}

function renderView(force=true){
  const r = route();
  if(r.view === "book") return renderBook(force);
  if(r.view === "all") return renderAll(force);
  if(US) return renderUnit(force);
}

/* ---------- 0. 책 넣기 · 단위 ---------- */
const METHOD = {outline:"PDF 책갈피 (소절 단위)", fixed:"책갈피가 없어 20쪽씩", codex:"Codex"};
function syncDraft(t){
  if(t && (!DRAFT || DRAFT.book !== t.book || DRAFT._src !== JSON.stringify(t.units))){
    DRAFT = JSON.parse(JSON.stringify(t)); DRAFT._src = JSON.stringify(t.units); DRAFT.style = DRAFT.style || {quotes:"curly"};
  }
}
function renderBook(force){
  const t = APP.toc, j = APP.job;
  if(!force && document.activeElement && document.activeElement.closest("#unittable, #assign")) { updateJobBox("bookjob"); return }
  syncDraft(t);
  const seen = new Set();  // 앞뒤 단위가 나눠 갖는 쪽은 한 번만 센다
  if(DRAFT) DRAFT.units.filter(u=>u.include).forEach(u=>{ for(let p=u.pages[0]; p<=u.pages[1]; p++) seen.add(p) });
  const total = seen.size;
  $("view").innerHTML = `
  <h1>책 넣기 · 단위</h1>
  <div class="sub">① 가제본 PDF 전체를 넣고 → ② 소절 단위(최대 ${t?t.max_pages:20}쪽)와 정독 담당자·마감을 확인한 뒤 확정하면 소절별 워크스페이스가 만들어집니다.</div>
  <div id="bookjob"></div>
  <div class="card">
    <h2><span class="n">1</span>가제본 PDF 전체</h2>
    <div class="drop" id="bookdrop">
      <div><div class="name">${APP.book ? `<span class="ok">✔ ${esc(APP.book.file)}</span> <span class="mute">${kb(APP.book.size)}${t?` · ${t.page_count}쪽`:""}</span>` : `<span class="bad">✖ 아직 없음</span>`}</div>
      <div class="mute">이 화면 아무 곳에나 끌어다 놓거나 [선택] — 쪼개지 말고 원본 그대로 (PDF, 책갈피가 있으면 소절로 자동 분할)</div></div>
      <div><input type="file" id="bookfile" accept=".pdf" hidden><button onclick="$('bookfile').click()">선택</button></div>
    </div>
  </div>
  ${t ? `
  <div class="card" id="assign">
    <h2><span class="n">2</span>정독 배분 도우미 <span class="mute" style="font-weight:400">— 이름을 쉼표로 넣으면 쪽수가 고르게 이어지도록 나누고, 마감을 기간 안에 순서대로 펼칩니다</span></h2>
    <div class="row">
      <input type="text" id="names" placeholder="예: 김하늘, 이도윤, 박서연" style="width:280px">
      <label>시작 <input type="date" id="d0" value="${today()}"></label>
      <label>마감 <input type="date" id="d1" value="${new Date().getFullYear()+(new Date().getMonth()>=3?1:0)}-03-31"></label>
      <button onclick="assign()">배분하기</button>
      <span class="mute">아래 표에 채워집니다. 확정해야 저장됩니다.</span>
    </div>
  </div>
  <div class="card">
    <h2><span class="n">3</span>단위 확인 <span class="mute" style="font-weight:400">— 찾은 방식: ${esc(METHOD[t.method]||t.method)} · 포함 ${DRAFT.units.filter(u=>u.include).length}개 · ${total}쪽${t.confirmed?` · <span class="ok">확정됨 ${esc(t.confirmed_at||"")}</span>`:""}</span></h2>
    ${DRAFT.units.length ? `<div class="tbl"><table id="unittable"><thead><tr><th>포함</th><th>번호</th><th>제목</th><th>PDF 시작</th><th>PDF 끝</th><th>인쇄 쪽</th><th>쪽수</th><th>담당자</th><th>마감</th><th></th></tr></thead><tbody>
      ${DRAFT.units.map((u,i)=>{ const n = u.pages[1]-u.pages[0]+1; return `<tr>
        <td><input type="checkbox" ${u.include?"checked":""} onchange="DRAFT.units[${i}].include=this.checked;renderView(true)"></td>
        <td><input type="text" value="${esc(u.id)}" style="width:62px" oninput="DRAFT.units[${i}].id=this.value"></td>
        <td><input type="text" value="${esc(u.title)}" oninput="DRAFT.units[${i}].title=this.value"></td>
        <td><input type="number" value="${u.pages[0]}" oninput="DRAFT.units[${i}].pages[0]=+this.value"></td>
        <td><input type="number" value="${u.pages[1]}" oninput="DRAFT.units[${i}].pages[1]=+this.value"></td>
        <td class="num mute">${pp(u.printed)}</td>
        <td class="num ${n>t.max_pages?"bad":""}">${n}</td>
        <td><input type="text" value="${esc(u.assignee||"")}" style="width:78px" oninput="DRAFT.units[${i}].assignee=this.value"></td>
        <td><input type="date" value="${esc(u.due||"")}" oninput="DRAFT.units[${i}].due=this.value"></td>
        <td style="white-space:nowrap"><button class="iconbtn" title="아래에 행 추가 (단위 나누기)" onclick="addRow(${i})">＋</button><button class="iconbtn" title="행 삭제" onclick="delRow(${i})">✕</button></td></tr>`}).join("")}
      </tbody></table></div>` : `<div class="empty">단위를 찾지 못했습니다. <button onclick="addRow(-1)">＋ 직접 행 추가</button> 또는 [Codex로 다시 뽑기]</div>`}
    <div class="row" style="margin-top:12px">
      <label class="mute">따옴표 기준 <select onchange="DRAFT.style.quotes=this.value">
        <option value="curly" ${DRAFT.style.quotes==="curly"?"selected":""}>굽은 따옴표 “ ” ‘ ’ 로 통일</option>
        <option value="keep" ${DRAFT.style.quotes!=="curly"?"selected":""}>검사하지 않음</option></select></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="confirmUnits()" ${!DRAFT.units.length?"disabled":""}>단위 확정 → 소절별 워크스페이스 만들기</button>
      <button onclick="codexToc()" ${j.running?"disabled":""} title="이 PC에 Codex 로그인이 되어 있어야 합니다">Codex로 다시 뽑기</button>

function assign(){
  const names = $("names").value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length) return toast("이름을 넣으세요.");
  const d0 = new Date($("d0").value), d1 = new Date($("d1").value);
  if(!(d1 > d0)) return toast("마감이 시작보다 뒤여야 합니다.");
  const us = DRAFT.units.filter(u=>u.include), pages = us.map(u=>u.pages[1]-u.pages[0]+1), total = pages.reduce((a,b)=>a+b,0);
  // 쪽수 기준으로 앞에서부터 이어지게 나눈다 (한 사람이 연속된 소절을 맡음)
  let acc = 0;
  const who = us.map((u,k)=>{ const mid = acc + pages[k]/2; acc += pages[k]; return Math.min(names.length-1, Math.floor(mid/total*names.length)) });
  // 사람마다 자기 몫 안에서 쪽수 비례로 마감을 펼친다
  names.forEach((_,w)=>{
    const mine = us.map((u,k)=>k).filter(k=>who[k]===w), sum = mine.reduce((a,k)=>a+pages[k],0); let c = 0;
    mine.forEach(k=>{ c += pages[k]; const d = new Date(d0.getTime() + (d1-d0)*c/sum); us[k].assignee = names[w]; us[k].due = d.toISOString().slice(0,10) });
  });
  renderView(true); toast(`${names.length}명에게 ${us.length}개 단위를 나눴습니다. 확인 후 [단위 확정]을 누르세요.`, 6000);
}

    <h2><span class="n">2</span>검토 <span class="mute" style="font-weight:400">→ 04_검토 — 체크·수정문구 편집 후 [반영 → 정오표]</span></h2>
    ${sm ? `<div class="kpis">
        <div class="kpi"><span class="mute">검토 후보</span><b>${sm.rows}</b></div>
        <div class="kpi"><span class="mute">규칙</span><b>${sm.rule}</b></div>
        <div class="kpi"><span class="mute">AI</span><b>${sm.codex}</b></div>
        ${Object.entries(sm.by_type).map(([k,v])=>`<div class="kpi"><span class="mute">${esc(k)}</span><b>${v}</b></div>`).join("")}
        ${sm.failed?`<div class="kpi"><span class="mute">판정 실패 구간</span><b class="bad">${sm.failed}</b></div>`:""}
        <div class="kpi"><span class="mute">판정 시각</span><b style="font-size:14px">${esc(sm.updated)}</b></div>
      </div>
      <div class="row" style="margin-bottom:8px"><a href="/review/${encodeURIComponent(u.id)}" target="_blank"><button>새 창으로 열기</button></a>
        ${sm.dropped_wrap?`<span class="mute">줄끝 띄어쓰기 ${sm.dropped_wrap}건은 인쇄본에서 보이지 않아 뺐습니다.</span>`:""}</div>
      <iframe src="/review/${encodeURIComponent(u.id)}?t=${encodeURIComponent(sm.updated)}" title="검토"></iframe>`
    : `<div class="empty">아직 판정 결과가 없습니다. [판정 시작]을 누르세요.</div>`}
  </div>

  <div class="card">
    <h2><span class="n">3</span>정오표 파일 <span class="mute" style="font-weight:400">→ 05_정오표 — 게시판에는 <b>정오표_게시판_*.html</b>, 엑셀은 <b>정오표_*.xlsx</b></span></h2>
    ${outFiles.length ? `<table><thead><tr><th>파일</th><th>시각</th><th></th></tr></thead><tbody>${outFiles.map(x=>`<tr>
        <td>${esc(x.name)} ${x.name.startsWith("정오표_게시판")?'<span class="tag">게시판용</span>':x.name.endsWith(".xlsx")?'<span class="tag">엑셀</span>':""}</td><td class="mute">${x.time}</td>
        <td style="white-space:nowrap">${x.name.endsWith(".xlsx")?"":`<a href="/files/${encodeURIComponent(u.id)}/${encodeURI(x.path)}" target="_blank">보기</a> · `}<a href="/files/${encodeURIComponent(u.id)}/${encodeURI(x.path)}?dl=1">내려받기</a></td></tr>`).join("")}</tbody></table>`
      : `<div class="mute">아직 반영한 내역이 없습니다.</div>`}
  </div>`;
  updateJobBox("chjob");
}
const uid = () => route().id;
async function saveMeta(){
  try{ await api(`/api/unit/meta?id=${encodeURIComponent(uid())}`,{method:"POST",body:JSON.stringify({assignee:$("assignee").value, due:$("due").value})});
    toast("저장했습니다."); unitRendered=null; refresh() }catch(e){ toast(e.message) }
}
async function act(url){ try{ await api(`${url}${url.includes("/unit/")?"?id="+encodeURIComponent(uid()):""}`,{method:"POST"}); refresh() }catch(e){ toast(e.message) } }
async function openDir(stage){ try{ await api(`/api/unit/open?id=${encodeURIComponent(uid())}&stage=${encodeURIComponent(stage)}`,{method:"POST"}) }catch(e){ toast(e.message) } }

window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>{ e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if(f && route().view==="book" && /\.pdf$/i.test(f.name)) uploadBook(f);
  else if(f) toast("가제본 PDF는 '책 넣기 · 단위' 화면에 놓아 주세요.");
});
window.addEventListener("message", e=>{ if(e.data && e.data.tse==="applied"){ toast(`정오표 작성 — 체크한 ${e.data.checked ?? ""}건. 아래 '③ 정오표 파일'과 전체 합본 xlsx를 확인하세요.`, 6000); unitRendered=null; refresh() } });
window.addEventListener("hashchange", ()=>{ unitRendered=null; allRendered=null; US=null; refresh().then(()=>renderView(true)) });
refresh().then(()=>renderView(true));
</script></body></html>
